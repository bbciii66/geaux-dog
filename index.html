<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a0b2e">
<meta name="description" content="GEAUX DOG! Roux the corgi runs the tailgate gauntlet. Catch crawfish, dodge penalty flags.">
<title>GEAUX DOG! — Roux's Tailgate Gauntlet</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}
html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#12071f;
  font-family:'Trebuchet MS','Avenir Next',Verdana,sans-serif;-webkit-user-select:none;user-select:none;}
body{position:fixed;inset:0;touch-action:none;}
#wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
canvas{display:block;width:100%;height:100%;touch-action:none;}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px 22px;z-index:10;}
.hidden{display:none!important;}
#title .logo{font-size:clamp(44px,15vw,86px);font-weight:900;letter-spacing:-2px;line-height:.88;
  color:#FFC72C;text-shadow:0 4px 0 #7A3FAF,0 8px 24px rgba(0,0,0,.7);transform:rotate(-3deg);margin-bottom:6px;}
#title .logo span{color:#fff;display:block;font-size:.52em;letter-spacing:1px;transform:rotate(1.5deg);
  text-shadow:0 3px 0 #7A3FAF;}
.sub{color:#E8D9FF;font-size:clamp(13px,3.6vw,17px);margin:14px 0 4px;line-height:1.5;max-width:19em;}
.sub b{color:#FFC72C;}
.btn{margin-top:26px;background:linear-gradient(#FFD75E,#F0A500);color:#3B1A5C;border:0;
  padding:19px 52px;font-size:23px;font-weight:900;border-radius:999px;letter-spacing:1.5px;
  box-shadow:0 6px 0 #A86E00,0 10px 26px rgba(0,0,0,.55);cursor:pointer;font-family:inherit;}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #A86E00;}
.hint{margin-top:20px;color:#B49BD8;font-size:13px;line-height:1.6;}
#over .big{font-size:clamp(34px,11vw,58px);font-weight:900;color:#FFC72C;line-height:1;
  text-shadow:0 4px 0 #7A3FAF;transform:rotate(-2deg);}
#over .quip{color:#fff;font-size:clamp(15px,4.4vw,20px);margin:20px 0 6px;font-style:italic;
  line-height:1.45;max-width:17em;min-height:2.6em;}
.scorebox{margin-top:14px;color:#E8D9FF;font-size:17px;line-height:1.8;}
.scorebox .n{color:#FFC72C;font-weight:900;font-size:1.5em;}
.newbest{color:#7CFF9E;font-weight:900;font-size:15px;letter-spacing:2px;margin-top:10px;
  animation:pulse .7s ease-in-out infinite alternate;}
@keyframes pulse{from{opacity:.55;transform:scale(.97)}to{opacity:1;transform:scale(1.04)}}
#egg{margin-top:18px;color:#8E74B8;font-size:12px;min-height:1.3em;}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>

<div id="title" class="screen">
  <div class="logo">GEAUX<span>DOG!</span></div>
  <div class="sub">Roux the corgi is loose at the tailgate.<br>Somebody knocked over the <b>crawfish pot</b>.</div>
  <div class="sub" style="margin-top:12px">Catch the good stuff.<br>Dodge the <b>penalty flags</b>.</div>
  <button class="btn" id="startBtn">GEAUX!</button>
  <div class="hint">Drag your thumb to run &nbsp;·&nbsp; One hand, portrait</div>
  <div id="egg"></div>
</div>

<div id="over" class="screen hidden">
  <div class="big" id="overTitle">BOIL'S OFF</div>
  <div class="quip" id="quip"></div>
  <div class="scorebox">SCORE &nbsp;<span class="n" id="finalScore">0</span><br>
    <span style="font-size:15px;color:#B49BD8">BEST &nbsp;<span id="bestScore">0</span></span></div>
  <div class="newbest hidden" id="newBest">★ NEW TAILGATE RECORD ★</div>
  <button class="btn" id="againBtn">RUN IT BACK</button>
  <div class="hint" id="statline"></div>
</div>

<script>
"use strict";
(function(){
// ───────────────────────────── setup ─────────────────────────────
var cv=document.getElementById('c'), ctx=cv.getContext('2d',{alpha:false});
var W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2.5);
  W=Math.max(1,window.innerWidth); H=Math.max(1,window.innerHeight);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  buildSkyline();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,250);});

// ───────────────────────────── audio (generated, no assets) ─────────────────────────────
var AC=null, muted=false;
function audioInit(){
  if(AC) return;
  try{ var C=window.AudioContext||window.webkitAudioContext; if(!C) return; AC=new C(); }catch(e){ AC=null; }
}
function blip(freq,dur,type,vol,slideTo){
  if(!AC||muted) return;
  try{
    if(AC.state==='suspended') AC.resume();
    var o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime;
    o.type=type||'square'; o.frequency.setValueAtTime(freq,t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo),t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.11,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+0.03);
  }catch(e){}
}
function chord(list,dur,vol){ for(var i=0;i<list.length;i++) blip(list[i],dur,'triangle',vol||0.07); }

// ───────────────────────────── state ─────────────────────────────
var STATE='title';
var dog, items, parts, floats, score, lives, combo, bestCombo, boil, geaux, geauxT,
    level, spawnT, spawnGap, shake, timeAlive, caught, missed, flash, hurtT, started;
var best = (function(){ try{ return parseInt(localStorage.getItem('geauxdog_best')||'0',10)||0; }catch(e){ return 0; } })();

var GROUND=function(){ return H-Math.max(74,H*0.11); };

function reset(){
  dog={x:W/2,y:0,vx:0,tx:W/2,w:0,tilt:0,sq:1,blink:0,bark:0};
  dog.w=Math.max(54,Math.min(84,W*0.17));
  dog.y=GROUND();
  items=[]; parts=[]; floats=[];
  score=0; lives=3; combo=0; bestCombo=0; boil=0; geaux=false; geauxT=0;
  level=0; spawnT=0.5; spawnGap=0.9; shake=0; timeAlive=0; caught=0; missed=0;
  flash=0; hurtT=0;
}

// ───────────────────────────── input ─────────────────────────────
var dragging=false;
function px(e){
  var r=cv.getBoundingClientRect();
  var t=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0])||e;
  return t.clientX-r.left;
}
function onDown(e){
  audioInit();
  if(STATE!=='play') return;
  dragging=true; if(dog) dog.tx=px(e);
  if(e.cancelable) e.preventDefault();
}
function onMove(e){
  if(STATE!=='play'||!dragging) return;
  if(dog) dog.tx=px(e);
  if(e.cancelable) e.preventDefault();
}
function onUp(e){ dragging=false; if(e.cancelable&&STATE==='play') e.preventDefault(); }
cv.addEventListener('touchstart',onDown,{passive:false});
cv.addEventListener('touchmove',onMove,{passive:false});
cv.addEventListener('touchend',onUp,{passive:false});
cv.addEventListener('touchcancel',onUp,{passive:false});
cv.addEventListener('mousedown',onDown);
window.addEventListener('mousemove',onMove);
window.addEventListener('mouseup',onUp);
// keyboard is a bonus, never required
var keyL=false,keyR=false;
window.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft')keyL=true; if(e.key==='ArrowRight')keyR=true;
  if((e.key===' '||e.key==='Enter')){ if(STATE==='title')startGame(); else if(STATE==='over')startGame(); }
});
window.addEventListener('keyup',function(e){ if(e.key==='ArrowLeft')keyL=false; if(e.key==='ArrowRight')keyR=false; });
document.addEventListener('gesturestart',function(e){e.preventDefault();});
document.addEventListener('dblclick',function(e){e.preventDefault();},{passive:false});

// ───────────────────────────── item kinds ─────────────────────────────
// good:true => catch it.  score, radius, speed multiplier
var KINDS={
  crawfish:{good:true, pts:10, r:19, sp:1.00, boil:9},
  football:{good:true, pts:25, r:20, sp:1.30, boil:6},
  kingcake:{good:true, pts:50, r:23, sp:0.88, boil:18},
  flag    :{good:false,pts:0,  r:19, sp:1.12},
  chair   :{good:false,pts:0,  r:24, sp:0.95}
};
function pickKind(){
  var r=Math.random(), pool=[];
  pool.push(['crawfish',52]);
  pool.push(['flag', 20+Math.min(14,level*2)]);
  if(score>=150) pool.push(['football',22]);
  if(score>=400) pool.push(['chair',13]);
  if(score>=800) pool.push(['kingcake',6]);
  var tot=0,i; for(i=0;i<pool.length;i++) tot+=pool[i][1];
  var n=Math.random()*tot, acc=0;
  for(i=0;i<pool.length;i++){ acc+=pool[i][1]; if(n<acc) return pool[i][0]; }
  return 'crawfish';
}
function spawn(){
  var k=pickKind(), K=KINDS[k];
  var m=K.r+10;
  items.push({
    k:k, x:m+Math.random()*(W-m*2), y:-40,
    vy:(168+level*26)*K.sp*(0.9+Math.random()*0.25),
    vx:(Math.random()-0.5)*30,
    rot:Math.random()*6.28, vr:(Math.random()-0.5)*4.5, r:K.r, dead:false
  });
}

// ───────────────────────────── fx ─────────────────────────────
function burst(x,y,color,n,spd){
  for(var i=0;i<n;i++){
    var a=Math.random()*6.283, s=(spd||120)*(0.35+Math.random());
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,
      life:0.45+Math.random()*0.45,t:0,c:color,r:2+Math.random()*3.2});
  }
}
function floatTxt(x,y,txt,color,size){
  floats.push({x:x,y:y,t:0,life:0.95,txt:txt,c:color||'#FFC72C',s:size||20});
}

// ───────────────────────────── game flow ─────────────────────────────
function startGame(){
  audioInit(); resize(); reset();
  STATE='play'; started=Date.now();
  document.getElementById('title').classList.add('hidden');
  document.getElementById('over').classList.add('hidden');
  blip(440,0.09,'square',0.1,760); setTimeout(function(){blip(660,0.13,'square',0.1,980);},95);
}
var QUIPS_LOW=["Roux got distracted by a ceiling fan.","You have been out-jumped by a folding chair.",
  "Somebody's cousin ate the whole tray.","Two flags and a bad attitude.","The pot is cold. The people are disappointed."];
var QUIPS_MID=["Respectable. Your uncle is only mildly critical.","Solid showing. No one lost a finger.",
  "The neighbors nodded at you. That's big.","You have earned one (1) boudin link.","Decent. The ice held out."];
var QUIPS_HIGH=["They're chanting your name. Or a similar name.","Roux has been offered a scholarship.",
  "Someone just painted you on a cooler.","Local legend. Parade pending.","You have peaked. Go outside."];
function endGame(){
  STATE='over';
  var isNew=score>best;
  if(isNew){ best=score; try{localStorage.setItem('geauxdog_best',String(best));}catch(e){} }
  var q = score<250?QUIPS_LOW : (score<1200?QUIPS_MID:QUIPS_HIGH);
  document.getElementById('quip').textContent=q[Math.floor(Math.random()*q.length)];
  document.getElementById('finalScore').textContent=score;
  document.getElementById('bestScore').textContent=best;
  document.getElementById('overTitle').textContent = score>=1200?"WHAT A RUN":"BOIL'S OFF";
  document.getElementById('newBest').classList.toggle('hidden',!isNew);
  var secs=Math.round(timeAlive);
  document.getElementById('statline').textContent=
    'Caught '+caught+' · Best combo x'+(1+Math.floor(bestCombo/5))+' · '+secs+'s on the field';
  document.getElementById('over').classList.remove('hidden');
  blip(300,0.2,'sawtooth',0.09,90); setTimeout(function(){blip(200,0.3,'sawtooth',0.08,70);},170);
}
document.getElementById('startBtn').addEventListener('click',function(e){e.preventDefault();startGame();});
document.getElementById('againBtn').addEventListener('click',function(e){e.preventDefault();startGame();});

// title easter egg
var eggN=0;
document.querySelector('#title .logo').addEventListener('click',function(){
  audioInit(); eggN++;
  var m=['','','woof.','WOOF.','Roux is getting excited.','ROUX IS READY. GEAUX.'];
  document.getElementById('egg').textContent = m[Math.min(eggN,5)];
  blip(520+eggN*90,0.08,'square',0.09);
  if(eggN>=5) document.getElementById('egg').style.color='#FFC72C';
});

// ───────────────────────────── update ─────────────────────────────
function update(dt){
  timeAlive+=dt;
  // difficulty
  level=Math.floor(score/300);
  spawnGap=Math.max(0.30,0.90-level*0.052);

  // dog movement
  if(keyL) dog.tx-=560*dt; if(keyR) dog.tx+=560*dt;
  var half=dog.w*0.5;
  dog.tx=Math.max(half,Math.min(W-half,dog.tx));
  var dx=dog.tx-dog.x;
  dog.x+=dx*Math.min(1,dt*15);
  dog.vx=dx;
  dog.tilt += ((Math.max(-1,Math.min(1,dx/55))*0.34)-dog.tilt)*Math.min(1,dt*10);
  dog.sq += (1-dog.sq)*Math.min(1,dt*9);
  dog.y=GROUND();
  dog.blink-=dt; if(dog.blink<-2.2) dog.blink=0.14+Math.random()*0.1;
  if(dog.bark>0) dog.bark-=dt;

  // geaux mode
  if(geaux){
    geauxT-=dt;
    if(geauxT<=0){ geaux=false; boil=0; blip(300,0.25,'sine',0.07,140); }
  }

  // spawning
  spawnT-=dt;
  if(spawnT<=0){ spawn(); spawnT=spawnGap*(0.78+Math.random()*0.44); if(geaux&&Math.random()<0.45) spawn(); }

  // items
  var catchY=dog.y-dog.w*0.30, i,it,K;
  for(i=items.length-1;i>=0;i--){
    it=items[i]; K=KINDS[it.k];
    // geaux magnet on good items
    if(geaux&&K.good){
      var mdx=dog.x-it.x, md=Math.abs(mdx);
      if(md<170 && it.y>H*0.30) it.x += Math.sign(mdx)*Math.min(md,300*dt);
    }
    it.y+=it.vy*dt; it.x+=it.vx*dt; it.rot+=it.vr*dt;
    if(it.x<it.r){it.x=it.r;it.vx=Math.abs(it.vx);}
    if(it.x>W-it.r){it.x=W-it.r;it.vx=-Math.abs(it.vx);}

    // collision with dog (generous, forgiving hitbox)
    var hy=Math.abs(it.y-catchY), hx=Math.abs(it.x-dog.x);
    if(hy < it.r+dog.w*0.30 && hx < it.r+dog.w*0.46 && !it.dead){
      it.dead=true; items.splice(i,1);
      if(K.good){
        caught++; combo++; if(combo>bestCombo) bestCombo=combo;
        var mult=Math.min(5,1+Math.floor(combo/5))*(geaux?2:1);
        var gain=K.pts*mult;
        score+=gain;
        dog.sq=1.42; dog.bark=0.18;
        floatTxt(it.x,catchY-26,'+'+gain,geaux?'#FFF3B0':'#FFC72C',mult>1?24:20);
        burst(it.x,catchY,K===KINDS.crawfish?'#FF5B3A':(it.k==='kingcake'?'#8FE36B':'#F3C27B'),12,150);
        if(!geaux){
          boil+=K.boil;
          if(boil>=100){ boil=100; geaux=true; geauxT=8; flash=1;
            floatTxt(W/2,H*0.36,'GEAUX MODE!','#FFD75E',34);
            chord([523,659,784,1046],0.34,0.075); shake=Math.max(shake,9); }
        }
        if(it.k==='football'){ blip(560,0.1,'triangle',0.1,880); }
        else if(it.k==='kingcake'){ chord([659,880],0.22,0.08); floatTxt(it.x,catchY-54,'KING CAKE!','#C39BFF',19); }
        else blip(700+Math.min(600,combo*22),0.06,'square',0.085);
        if(mult>=3&&combo%5===0) floatTxt(dog.x,catchY-56,'x'+mult+' COMBO','#7CFF9E',19);
      } else {
        hit(it.x,catchY,it.k);
      }
      continue;
    }
    // off bottom
    if(it.y-it.r>H+30){
      items.splice(i,1);
      if(K.good){ missed++; if(combo>2) floatTxt(dog.x,catchY-30,'combo lost','#C79BE0',15); combo=0; }
    }
  }

  // particles / floats
  for(i=parts.length-1;i>=0;i--){
    var p=parts[i]; p.t+=dt;
    if(p.t>=p.life){parts.splice(i,1);continue;}
    p.vy+=560*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
  }
  for(i=floats.length-1;i>=0;i--){
    var f=floats[i]; f.t+=dt; f.y-=52*dt;
    if(f.t>=f.life) floats.splice(i,1);
  }
  if(shake>0) shake=Math.max(0,shake-dt*26);
  if(flash>0) flash=Math.max(0,flash-dt*2.2);
  if(hurtT>0) hurtT=Math.max(0,hurtT-dt);
}
function hit(x,y,kind){
  lives--; combo=0; shake=14; hurtT=0.55;
  boil=Math.max(0,boil-28);
  burst(x,y,kind==='flag'?'#FFE14D':'#9FD4FF',18,190);
  floatTxt(dog.x,y-34,kind==='flag'?'FLAG!':'OW.','#FF7A7A',26);
  dog.sq=0.66;
  blip(220,0.16,'sawtooth',0.11,80);
  if(lives<=0) setTimeout(endGame,340);
}

// ───────────────────────────── drawing ─────────────────────────────
var sky=[];
function buildSkyline(){
  sky=[]; var x=0;
  while(x<W+60){ var w=26+Math.random()*54, h=24+Math.random()*60;
    sky.push({x:x,w:w,h:h,t:Math.random()<0.42?'tent':'tree'}); x+=w*0.86; }
}
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
function drawBG(){
  var g=ctx.createLinearGradient(0,0,0,H);
  if(geaux){ g.addColorStop(0,'#3C1E00'); g.addColorStop(.45,'#6B3A00'); g.addColorStop(1,'#A86E00'); }
  else { g.addColorStop(0,'#12071f'); g.addColorStop(.5,'#2A1147'); g.addColorStop(1,'#47206E'); }
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // stadium glow
  var gy=H*0.30;
  var rg=ctx.createRadialGradient(W*0.5,gy,10,W*0.5,gy,Math.max(W,H)*0.62);
  rg.addColorStop(0,geaux?'rgba(255,215,94,.30)':'rgba(255,199,44,.16)');
  rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg; ctx.fillRect(0,0,W,H);
  // light poles
  ctx.fillStyle='rgba(255,255,255,.07)';
  ctx.fillRect(W*0.16-3,H*0.10,6,H*0.16); ctx.fillRect(W*0.84-3,H*0.10,6,H*0.16);
  ctx.fillStyle=geaux?'rgba(255,240,180,.85)':'rgba(255,240,180,.55)';
  ctx.beginPath(); ctx.arc(W*0.16,H*0.10,11,0,6.283); ctx.fill();
  ctx.beginPath(); ctx.arc(W*0.84,H*0.10,11,0,6.283); ctx.fill();
  // skyline
  var base=GROUND()+22;
  for(var i=0;i<sky.length;i++){
    var s=sky[i];
    ctx.fillStyle=geaux?'rgba(60,25,0,.72)':'rgba(16,6,30,.72)';
    if(s.t==='tent'){
      ctx.beginPath(); ctx.moveTo(s.x,base); ctx.lineTo(s.x+s.w*0.5,base-s.h);
      ctx.lineTo(s.x+s.w,base); ctx.closePath(); ctx.fill();
    } else {
      ctx.beginPath(); ctx.ellipse(s.x+s.w*0.5,base-s.h*0.72,s.w*0.44,s.h*0.55,0,0,6.283); ctx.fill();
      ctx.fillRect(s.x+s.w*0.46,base-s.h*0.5,5,s.h*0.5);
    }
  }
  // ground
  ctx.fillStyle=geaux?'#6B3A00':'#24123D'; ctx.fillRect(0,GROUND()+22,W,H);
  ctx.fillStyle='rgba(255,255,255,.05)'; ctx.fillRect(0,GROUND()+22,W,3);
}
function drawDog(){
  var x=dog.x,y=dog.y,w=dog.w,h=w*0.78*dog.sq, bw=w*dog.sq>1?w:w;
  ctx.save(); ctx.translate(x,y); ctx.rotate(dog.tilt*0.5);
  var hurt = hurtT>0 && (Math.floor(hurtT*18)%2===0);
  var body=hurt?'#FF9E9E':'#E8913F', light=hurt?'#FFC9C9':'#F7B96B';
  // shadow
  ctx.fillStyle='rgba(0,0,0,.34)';
  ctx.beginPath(); ctx.ellipse(0,h*0.50,w*0.44,7,0,0,6.283); ctx.fill();
  // tail
  ctx.fillStyle=light;
  ctx.beginPath(); ctx.ellipse(-w*0.44,-h*0.10,w*0.13,w*0.10,0.5,0,6.283); ctx.fill();
  // legs
  ctx.fillStyle=body;
  var lw=w*0.13, lh=h*0.26, sw=Math.sin(timeAlive*13)*(Math.min(1,Math.abs(dog.vx)/30))*w*0.07;
  rr(-w*0.27-lw/2+sw,h*0.22,lw,lh,3); ctx.fill();
  rr(w*0.17-lw/2-sw,h*0.22,lw,lh,3); ctx.fill();
  // body
  ctx.fillStyle=body; rr(-w*0.44,-h*0.30,w*0.88,h*0.62,h*0.24); ctx.fill();
  // chest blaze
  ctx.fillStyle='#FFF6E8';
  ctx.beginPath(); ctx.ellipse(w*0.10,h*0.02,w*0.16,h*0.22,0,0,6.283); ctx.fill();
  // head
  var hx=w*0.30, hy=-h*0.40, hr=w*0.27;
  // ears (big corgi ears)
  ctx.fillStyle=body;
  ctx.beginPath(); ctx.moveTo(hx-hr*0.72,hy-hr*0.30); ctx.lineTo(hx-hr*0.30,hy-hr*1.72);
  ctx.lineTo(hx+hr*0.10,hy-hr*0.46); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(hx+hr*0.30,hy-hr*0.40); ctx.lineTo(hx+hr*0.86,hy-hr*1.60);
  ctx.lineTo(hx+hr*1.02,hy-hr*0.22); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#C46B2E';
  ctx.beginPath(); ctx.moveTo(hx-hr*0.50,hy-hr*0.40); ctx.lineTo(hx-hr*0.28,hy-hr*1.36);
  ctx.lineTo(hx-hr*0.02,hy-hr*0.48); ctx.closePath(); ctx.fill();
  // head shape
  ctx.fillStyle=body;
  ctx.beginPath(); ctx.ellipse(hx,hy,hr*1.06,hr*0.94,0,0,6.283); ctx.fill();
  // muzzle
  ctx.fillStyle='#FFF6E8';
  ctx.beginPath(); ctx.ellipse(hx+hr*0.34,hy+hr*0.34,hr*0.56,hr*0.44,0,0,6.283); ctx.fill();
  // eyes
  ctx.fillStyle='#241019';
  if(dog.blink>0){
    ctx.fillRect(hx-hr*0.06,hy-hr*0.16,hr*0.26,2.2);
    ctx.fillRect(hx+hr*0.46,hy-hr*0.16,hr*0.26,2.2);
  } else {
    ctx.beginPath(); ctx.ellipse(hx+hr*0.06,hy-hr*0.12,hr*0.13,hr*0.17,0,0,6.283); ctx.fill();
    ctx.beginPath(); ctx.ellipse(hx+hr*0.58,hy-hr*0.12,hr*0.13,hr*0.17,0,0,6.283); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(hx+hr*0.10,hy-hr*0.19,hr*0.05,0,6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(hx+hr*0.62,hy-hr*0.19,hr*0.05,0,6.283); ctx.fill();
  }
  // nose + mouth
  ctx.fillStyle='#241019';
  ctx.beginPath(); ctx.ellipse(hx+hr*0.76,hy+hr*0.22,hr*0.13,hr*0.10,0,0,6.283); ctx.fill();
  if(dog.bark>0){ ctx.fillStyle='#7A2436';
    ctx.beginPath(); ctx.ellipse(hx+hr*0.52,hy+hr*0.56,hr*0.22,hr*0.19,0,0,6.283); ctx.fill(); }
  else { ctx.strokeStyle='#241019'; ctx.lineWidth=2; ctx.beginPath();
    ctx.arc(hx+hr*0.50,hy+hr*0.34,hr*0.22,0.25,2.5); ctx.stroke(); }
  // geaux mode sparkle collar
  if(geaux){
    ctx.strokeStyle='#FFD75E'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.ellipse(w*0.06,-h*0.14,w*0.20,h*0.13,0,0,6.283); ctx.stroke();
  }
  ctx.restore();
}
function drawItem(it){
  var K=KINDS[it.k];
  ctx.save(); ctx.translate(it.x,it.y); ctx.rotate(it.rot*(it.k==='football'?0.6:1));
  var r=it.r;
  if(it.k==='crawfish'){
    ctx.fillStyle='#E23B1E';
    ctx.beginPath(); ctx.ellipse(0,0,r*0.56,r*0.84,0,0,6.283); ctx.fill();
    ctx.fillStyle='#FF6A4A';
    for(var s=0;s<3;s++){ ctx.beginPath();
      ctx.ellipse(0,r*0.24+s*r*0.26,r*0.46-s*r*0.09,r*0.17,0,0,6.283); ctx.fill(); }
    ctx.fillStyle='#E23B1E';
    ctx.beginPath(); ctx.ellipse(-r*0.62,-r*0.60,r*0.30,r*0.19,-0.7,0,6.283); ctx.fill();
    ctx.beginPath(); ctx.ellipse(r*0.62,-r*0.60,r*0.30,r*0.19,0.7,0,6.283); ctx.fill();
    ctx.strokeStyle='#B32A12'; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(-r*0.16,-r*0.76); ctx.lineTo(-r*0.36,-r*1.18); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r*0.16,-r*0.76); ctx.lineTo(r*0.36,-r*1.18); ctx.stroke();
    ctx.fillStyle='#2A0A05';
    ctx.beginPath(); ctx.arc(-r*0.17,-r*0.50,r*0.09,0,6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(r*0.17,-r*0.50,r*0.09,0,6.283); ctx.fill();
  } else if(it.k==='football'){
    ctx.fillStyle='#7A4420';
    ctx.beginPath(); ctx.ellipse(0,0,r*1.06,r*0.66,0,0,6.283); ctx.fill();
    ctx.strokeStyle='#FFF6E8'; ctx.lineWidth=2.4;
    ctx.beginPath(); ctx.moveTo(-r*0.46,0); ctx.lineTo(r*0.46,0); ctx.stroke();
    ctx.lineWidth=2;
    for(var l=-2;l<=2;l++){ ctx.beginPath();
      ctx.moveTo(l*r*0.20,-r*0.17); ctx.lineTo(l*r*0.20,r*0.17); ctx.stroke(); }
    ctx.strokeStyle='#5C3117'; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.ellipse(0,0,r*1.06,r*0.66,0,0,6.283); ctx.stroke();
  } else if(it.k==='kingcake'){
    ctx.fillStyle='#E8C98A';
    ctx.beginPath(); ctx.arc(0,0,r*0.92,0,6.283); ctx.fill();
    ctx.fillStyle=geaux?'#6B3A00':'#2A1147';
    ctx.beginPath(); ctx.arc(0,0,r*0.36,0,6.283); ctx.fill();
    var cols=['#8E4FD0','#5FC46B','#FFC72C'];
    for(var c=0;c<6;c++){
      ctx.strokeStyle=cols[c%3]; ctx.lineWidth=r*0.30; ctx.lineCap='round';
      var a0=c*1.047; ctx.beginPath(); ctx.arc(0,0,r*0.64,a0,a0+0.62); ctx.stroke();
    }
    ctx.lineCap='butt';
  } else if(it.k==='flag'){
    ctx.fillStyle='#FFE14D';
    ctx.beginPath();
    ctx.moveTo(-r*0.86,-r*0.30); ctx.quadraticCurveTo(0,-r*0.92,r*0.86,-r*0.24);
    ctx.quadraticCurveTo(r*0.44,r*0.52,0,r*0.36);
    ctx.quadraticCurveTo(-r*0.50,r*0.66,-r*0.86,-r*0.30);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle='#D6B400';
    ctx.beginPath(); ctx.arc(r*0.30,r*0.10,r*0.20,0,6.283); ctx.fill();
    ctx.strokeStyle='#8A7400'; ctx.lineWidth=1.6; ctx.stroke();
  } else { // chair
    ctx.fillStyle='#2D6FB8';
    rr(-r*0.72,-r*0.16,r*1.44,r*0.30,3); ctx.fill();
    rr(-r*0.66,-r*0.94,r*1.32,r*0.74,4); ctx.fill();
    ctx.fillStyle='#1C4E85';
    for(var st=0;st<3;st++) ctx.fillRect(-r*0.66+st*r*0.46,-r*0.94,r*0.14,r*0.74);
    ctx.strokeStyle='#C9D6E2'; ctx.lineWidth=2.6;
    ctx.beginPath(); ctx.moveTo(-r*0.58,r*0.14); ctx.lineTo(-r*0.76,r*0.86); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r*0.58,r*0.14); ctx.lineTo(r*0.76,r*0.86); ctx.stroke();
  }
  ctx.restore();
}
function drawHUD(){
  ctx.save();
  // score
  ctx.fillStyle='#fff'; ctx.font='900 '+Math.round(Math.min(38,W*0.095))+'px Trebuchet MS, sans-serif';
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.shadowColor='rgba(0,0,0,.6)'; ctx.shadowBlur=6; ctx.shadowOffsetY=2;
  ctx.fillText(String(score),16,14+(window.screenTopInset||0));
  ctx.shadowBlur=0; ctx.shadowOffsetY=0;
  ctx.fillStyle='#C9B3E8'; ctx.font='700 12px Trebuchet MS, sans-serif';
  ctx.fillText('BEST '+Math.max(best,score),17,14+Math.min(38,W*0.095)+2);
  // lives (paws)
  for(var i=0;i<3;i++){
    var lx=W-22-i*26, ly=26, on=(i<lives);
    ctx.fillStyle=on?'#FF8FA3':'rgba(255,255,255,.16)';
    ctx.beginPath(); ctx.ellipse(lx,ly,7.5,6.5,0,0,6.283); ctx.fill();
    for(var t=0;t<3;t++){ ctx.beginPath();
      ctx.ellipse(lx-6+t*6,ly-9.5,2.6,3.4,0,0,6.283); ctx.fill(); }
  }
  // combo
  var mult=Math.min(5,1+Math.floor(combo/5));
  if(mult>1){
    ctx.textAlign='center'; ctx.fillStyle=geaux?'#FFF3B0':'#7CFF9E';
    ctx.font='900 '+Math.round(Math.min(22,W*0.056))+'px Trebuchet MS, sans-serif';
    ctx.fillText('x'+(mult*(geaux?2:1)),W/2,16);
  }
  // boil meter
  var bw=Math.min(W-40,300), bx=(W-bw)/2, by=H-Math.max(30,H*0.045), bh=13;
  ctx.fillStyle='rgba(0,0,0,.42)'; rr(bx,by,bw,bh,bh/2); ctx.fill();
  var pct = geaux ? Math.max(0,geauxT/8) : boil/100;
  var bg2=ctx.createLinearGradient(bx,0,bx+bw,0);
  if(geaux){ bg2.addColorStop(0,'#FFD75E'); bg2.addColorStop(1,'#FF8A3D'); }
  else { bg2.addColorStop(0,'#FF5B3A'); bg2.addColorStop(1,'#FFC72C'); }
  ctx.fillStyle=bg2; rr(bx,by,Math.max(0,bw*pct),bh,bh/2); ctx.fill();
  ctx.fillStyle=geaux?'#FFF3B0':'#C9B3E8'; ctx.font='900 10px Trebuchet MS, sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.fillText(geaux?'GEAUX MODE':'BOIL METER',W/2,by-3);
  ctx.restore();
}
function draw(){
  ctx.save();
  if(shake>0){ ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake); }
  drawBG();
  var i;
  for(i=0;i<items.length;i++) drawItem(items[i]);
  drawDog();
  for(i=0;i<parts.length;i++){
    var p=parts[i], a=1-(p.t/p.life);
    ctx.globalAlpha=Math.max(0,a); ctx.fillStyle=p.c;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(0.4+a*0.8),0,6.283); ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(i=0;i<floats.length;i++){
    var f=floats[i], fa=1-(f.t/f.life);
    ctx.globalAlpha=Math.max(0,fa); ctx.fillStyle=f.c;
    ctx.font='900 '+f.s+'px Trebuchet MS, sans-serif';
    ctx.shadowColor='rgba(0,0,0,.55)'; ctx.shadowBlur=5;
    ctx.fillText(f.txt,f.x,f.y); ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1;
  ctx.restore();
  drawHUD();
  if(flash>0){ ctx.fillStyle='rgba(255,215,94,'+(flash*0.45)+')'; ctx.fillRect(0,0,W,H); }
  if(hurtT>0){ ctx.fillStyle='rgba(255,60,60,'+(hurtT*0.30)+')'; ctx.fillRect(0,0,W,H); }
}
// idle attract animation behind the title
function drawAttract(t){
  drawBG();
  ctx.save(); ctx.globalAlpha=0.5;
  for(var i=0;i<5;i++){
    var x=(W*(0.13+i*0.19)+Math.sin(t*0.6+i)*22);
    var y=((t*70+i*150)%(H+180))-90;
    ctx.save(); ctx.translate(x,y); ctx.rotate(t+i);
    drawItemRaw(i%2===0?'crawfish':'football',18); ctx.restore();
  }
  ctx.restore();
}
function drawItemRaw(k,r){ drawItem({k:k,x:0,y:0,r:r,rot:0}); }

// ───────────────────────────── loop ─────────────────────────────
var last=0, acc=0;
function frame(ts){
  requestAnimationFrame(frame);
  if(!last) last=ts;
  var dt=(ts-last)/1000; last=ts;
  if(dt>0.05) dt=0.05;           // clamp: tab-switch / stutter safety
  if(dt<=0) return;
  if(STATE==='play'){ update(dt); draw(); }
  else { acc+=dt; drawAttract(acc); }
}
document.addEventListener('visibilitychange',function(){ last=0; });

resize(); reset(); requestAnimationFrame(frame);
window.__geaux={get state(){return STATE;},get score(){return score;},get lives(){return lives;},
  get items(){return items.length;},get combo(){return combo;},get geaux(){return geaux;},
  get boil(){return boil;},get best(){return best;},
  start:startGame,
  setDog:function(x){ if(dog){dog.tx=x;dog.x=x;} },
  forceSpawn:function(k){ var K=KINDS[k]; items.push({k:k,x:dog.x,y:dog.y-dog.w*0.30-6,vy:0,vx:0,rot:0,vr:0,r:K.r,dead:false}); },
  kill:function(){ lives=1; if(dog) items.push({k:'flag',x:dog.x,y:dog.y-dog.w*0.30-4,vy:0,vx:0,rot:0,vr:0,r:19,dead:false}); }
};
})();
</script>
